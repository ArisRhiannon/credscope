[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credscope"
version = "0.1.0"
description = "After a supply-chain compromise, map which credentials a dev machine or CI runner could reach and print a rotation runbook. Never prints secret values. Offline, zero deps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Aris Rhiannon" }]
keywords = ["incident-response", "credential-rotation", "secrets", "supply-chain-security", "shai-hulud", "devsecops", "runbook", "ci-security", "npm-token", "github-token"]
dependencies = []

[project.urls]
Homepage = "https://github.com/ArisRhiannon/credscope"

[project.scripts]
credscope = "credscope.cli:main"

[tool.setuptools]
packages = ["credscope"]

